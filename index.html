<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ed" />
  <meta name="description" content="白隊對藍隊羽球兩局總分制直播計分板" />
  <title>白隊 vs 藍隊｜羽球計分板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ed;
      --panel: #fbfcfd;
      --panel-light: #f1f4f7;
      --line: rgba(35, 51, 72, .14);
      --text: #172235;
      --muted: #6f7b8c;
      --white: #f6e7ad;
      --white-soft: #fffaf0;
      --white-deep: #d3aa35;
      --white-text: #101827;
      --blue: #c8eafa;
      --blue-soft: #eef9ff;
      --blue-deep: #4f9fcf;
      --lime: #f0cd62;
      --danger: #ff7381;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(246, 231, 173, .78), transparent 30rem),
        radial-gradient(circle at 92% 8%, rgba(200, 234, 250, .78), transparent 32rem),
        var(--bg);
      padding: clamp(14px, 3vw, 32px);
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(1050px, 100%);
      margin: 0 auto;
    }

    .scoreboard {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 22px 58px rgba(48, 61, 77, .14);
    }

    .boardHeader {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, #fffdf7, #eef9fe);
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--blue-deep);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .14em;
    }

    .live::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue-deep);
      box-shadow: 0 0 0 4px rgba(79, 159, 207, .12);
      content: "";
    }

    .title {
      flex: 1;
      margin: 0;
      font-size: clamp(17px, 2.5vw, 23px);
      font-weight: 950;
      letter-spacing: .03em;
    }

    .rule {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .scoreGrid {
      display: grid;
      grid-template-columns: minmax(180px, 1.8fr) repeat(3, 1fr);
    }

    .gridHead {
      display: grid;
      place-items: center;
      min-height: 34px;
      border-right: 1px solid var(--line);
      background: #f1f4f6;
      color: #778396;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .12em;
    }

    .gridHead:first-child {
      justify-content: start;
      padding-left: 18px;
    }

    .gridHead:last-child { border-right: 0; }
    .gridHead.current { color: #99720a; background: #fff7d8; }

    .team {
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 96px;
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .team.white {
      color: var(--white-text);
      background: linear-gradient(90deg, var(--white-soft), var(--white));
    }

    .team.blue {
      color: var(--white-text);
      background: linear-gradient(90deg, var(--blue-soft), var(--blue));
    }

    .teamMark {
      width: 6px;
      height: 44px;
      margin-right: 14px;
      border-radius: 99px;
    }

    .white .teamMark { background: var(--white-deep); }
    .blue .teamMark { background: var(--blue-deep); }

    .teamName {
      overflow: hidden;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 950;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score,
    .total {
      display: grid;
      place-items: center;
      min-height: 96px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background: var(--panel);
      font-variant-numeric: tabular-nums;
      font-size: clamp(38px, 7vw, 62px);
      font-weight: 950;
      line-height: 1;
    }

    .score {
      border-radius: 0;
      cursor: pointer;
    }

    .score:active { background: #edf2f6; }
    .score.current { background: #fff9e7; }
    .score.winner { color: #a87800; }
    .score.empty { color: #9aa5b3; }

    .total {
      border-right: 0;
      background: linear-gradient(180deg, #f7f9fb, #edf2f6);
    }

    .total.leader { color: #a87800; }

    .boardFooter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
      padding: 9px 18px;
      border-top: 1px solid var(--line);
      background: #f8fafb;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .status { color: #465367; }
    .status strong { color: #99720a; }

    .controls {
      margin-top: 18px;
      padding: clamp(16px, 2.5vw, 24px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 16px 44px rgba(48, 61, 77, .09);
    }

    .gamePicker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 16px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #eef2f5;
    }

    .gameButton {
      min-height: 48px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 950;
      cursor: pointer;
    }

    .gameButton.active {
      background: var(--lime);
      color: #493700;
    }

    .teamControls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .teamControl {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(48, 61, 77, .07);
    }

    .controlTitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 10px 16px;
      font-size: 19px;
      font-weight: 950;
    }

    .whiteControl .controlTitle {
      color: var(--white-text);
      background: var(--white);
    }

    .blueControl .controlTitle {
      color: var(--white-text);
      background: var(--blue);
    }

    .currentValue {
      font-variant-numeric: tabular-nums;
      font-size: 27px;
    }

    .buttonRow {
      display: grid;
      grid-template-columns: .72fr 1.5fr;
      gap: 10px;
      padding: 12px;
    }

    .scoreButton {
      min-height: clamp(92px, 16vw, 138px);
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel-light);
      font-size: clamp(27px, 5vw, 42px);
      font-weight: 950;
      cursor: pointer;
      transition: transform .08s ease;
    }

    .scoreButton:active { transform: scale(.975); }

    .plus {
      color: #253044;
      background: var(--lime);
    }

    .whiteControl .plus { background: var(--white); }
    .blueControl .plus { background: var(--blue); }

    .minus { color: #536174; }

    .clearButton {
      width: 100%;
      min-height: 58px;
      margin-top: 14px;
      border: 1px solid rgba(199, 66, 80, .35);
      border-radius: 14px;
      background: #fff5f6;
      color: #c74250;
      font-size: 15px;
      font-weight: 950;
      cursor: pointer;
    }

    .clearButton:active { background: #ffe9ec; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      padding: 11px 17px;
      border: 1px solid rgba(79, 159, 207, .28);
      border-radius: 999px;
      background: #f0f9fd;
      color: #286f99;
      font-size: 12px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.displayOnly {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 18px;
      overflow: hidden;
      background: transparent;
    }

    body.displayOnly .app {
      width: min(1180px, calc(100vw - 36px));
    }

    body.displayOnly .controls { display: none; }
    body.displayOnly .score { cursor: default; }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .rule { display: none; }
      .scoreGrid { grid-template-columns: minmax(115px, 1.45fr) repeat(3, 1fr); }
      .gridHead:first-child { padding-left: 11px; }
      .team, .score, .total { min-height: 74px; }
      .team { padding: 8px 11px; }
      .teamMark { width: 4px; height: 34px; margin-right: 8px; }
      .teamName { font-size: clamp(20px, 6vw, 30px); }
      .score, .total { font-size: clamp(30px, 9vw, 46px); }
      .teamControls { grid-template-columns: 1fr; }
      .scoreButton { min-height: 90px; }
    }

    @media (max-width: 420px) {
      .live { font-size: 0; }
      .title { font-size: 17px; }
      .boardFooter span:last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="scoreboard" aria-label="白隊對藍隊羽球計分板">
      <header class="boardHeader">
        <span class="live">LIVE</span>
        <h1 class="title">白隊 VS 藍隊</h1>
        <span class="rule">兩局總分 · 15 分 · 17 分封頂</span>
      </header>

      <div class="scoreGrid">
        <div class="gridHead">隊伍</div>
        <div class="gridHead gameHead current" data-game="1">第 1 局</div>
        <div class="gridHead gameHead" data-game="2">第 2 局</div>
        <div class="gridHead">總分</div>

        <div class="team white">
          <span class="teamMark"></span>
          <span class="teamName">白隊</span>
        </div>
        <button id="A1" class="score empty current" data-game="1" aria-label="白隊第一局分數">–</button>
        <button id="A2" class="score empty" data-game="2" aria-label="白隊第二局分數">–</button>
        <div id="totalA" class="total" aria-label="白隊兩局總分">0</div>

        <div class="team blue">
          <span class="teamMark"></span>
          <span class="teamName">藍隊</span>
        </div>
        <button id="B1" class="score empty current" data-game="1" aria-label="藍隊第一局分數">–</button>
        <button id="B2" class="score empty" data-game="2" aria-label="藍隊第二局分數">–</button>
        <div id="totalB" class="total" aria-label="藍隊兩局總分">0</div>
      </div>

      <footer class="boardFooter">
        <span id="status" class="status"><strong>第 1 局</strong> · 15 分制</span>
        <span>兩局總分決勝</span>
      </footer>
    </section>

    <section class="controls" aria-label="平板計分控制">
      <div class="gamePicker" aria-label="選擇局數">
        <button class="gameButton active" data-pick-game="1">第 1 局</button>
        <button class="gameButton" data-pick-game="2">第 2 局</button>
      </div>

      <div class="teamControls">
        <article class="teamControl whiteControl">
          <div class="controlTitle">
            <span>白隊</span>
            <span id="currentA" class="currentValue">0</span>
          </div>
          <div class="buttonRow">
            <button id="minusA" class="scoreButton minus" aria-label="白隊減一分">−1</button>
            <button id="plusA" class="scoreButton plus" aria-label="白隊加一分">+1</button>
          </div>
        </article>

        <article class="teamControl blueControl">
          <div class="controlTitle">
            <span>藍隊</span>
            <span id="currentB" class="currentValue">0</span>
          </div>
          <div class="buttonRow">
            <button id="minusB" class="scoreButton minus" aria-label="藍隊減一分">−1</button>
            <button id="plusB" class="scoreButton plus" aria-label="藍隊加一分">+1</button>
          </div>
        </article>
      </div>

      <button id="clearButton" class="clearButton">清空全部比分</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./scoreboard.js"></script>
</body>
</html>
