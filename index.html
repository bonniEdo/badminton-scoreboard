<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ed" />
  <meta name="description" content="白隊對藍隊羽球兩局總分制直播計分板" />
  <title>白隊 vs 藍隊｜羽球計分板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ed;
      --panel: #fbfcfd;
      --panel-light: #f1f4f7;
      --line: rgba(35, 51, 72, .14);
      --text: #172235;
      --muted: #6f7b8c;
      --white: #f6e7ad;
      --white-soft: #fffaf0;
      --white-deep: #d3aa35;
      --white-text: #101827;
      --blue: #c8eafa;
      --blue-soft: #eef9ff;
      --blue-deep: #4f9fcf;
      --lime: #f0cd62;
      --danger: #ff7381;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(246, 231, 173, .78), transparent 30rem),
        radial-gradient(circle at 92% 8%, rgba(200, 234, 250, .78), transparent 32rem),
        var(--bg);
      padding: clamp(14px, 3vw, 32px);
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(1050px, 100%);
      margin: 0 auto;
    }

    .scoreboard {
      width: min(900px, 100%);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 22px 58px rgba(48, 61, 77, .14);
      backdrop-filter: blur(8px);
    }

    .matchHeader {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px 18px;
      min-height: 86px;
      padding: 15px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(105deg, rgba(255, 250, 235, .96), rgba(239, 249, 255, .96));
    }

    .matchMeta {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .matchNumber,
    .matchType {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 950;
    }

    .matchNumber { background: var(--lime); color: #493700; }
    .matchType { background: #fff; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }

    .matchup {
      min-width: 0;
      text-align: right;
      font-size: clamp(18px, 3vw, 27px);
      font-weight: 950;
      line-height: 1.25;
    }

    .versus {
      margin: 0 8px;
      color: #8b96a5;
      font-size: .65em;
      letter-spacing: .08em;
    }

    .scoreGrid {
      display: grid;
      grid-template-columns: minmax(180px, 1.7fr) repeat(3, minmax(92px, 1fr));
    }

    .gridHead {
      display: grid;
      place-items: center;
      min-height: 38px;
      border-right: 1px solid var(--line);
      background: rgba(241, 244, 246, .92);
      color: #657286;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .06em;
    }

    .gridHead:last-child { border-right: 0; }
    .gridHead.current { color: #8a6500; background: rgba(255, 247, 216, .94); }
    .gridHead:first-child { background: rgba(248, 249, 250, .92); }

    .team {
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 104px;
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .team.white {
      color: var(--white-text);
      background: linear-gradient(90deg, var(--white-soft), var(--white));
    }

    .team.blue {
      color: var(--white-text);
      background: linear-gradient(90deg, var(--blue-soft), var(--blue));
    }

    .teamMark {
      width: 6px;
      height: 44px;
      margin-right: 14px;
      border-radius: 99px;
    }

    .white .teamMark { background: var(--white-deep); }
    .blue .teamMark { background: var(--blue-deep); }

    .teamName {
      overflow: hidden;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 950;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .score,
    .total {
      display: grid;
      place-items: center;
      min-height: 104px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background: var(--panel);
      font-variant-numeric: tabular-nums;
      font-size: clamp(38px, 7vw, 62px);
      font-weight: 950;
      line-height: 1;
    }

    .score {
      border-radius: 0;
      background: rgba(251, 252, 253, .92);
      cursor: pointer;
    }

    .score:active { background: #edf2f6; }
    .score.current { background: rgba(255, 249, 231, .94); }
    .score.winner { color: #a87800; }
    .score.empty { color: #9aa5b3; }

    .total {
      border-right: 0;
      background: linear-gradient(180deg, #f7f9fb, #edf2f6);
    }

    .total.leader { color: #a87800; }

    .scoreGrid > :nth-child(-n+4) { border-top: 0; }

    .controls {
      margin-top: 18px;
      padding: clamp(16px, 2.5vw, 24px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 16px 44px rgba(48, 61, 77, .09);
    }

    .matchPicker {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      gap: 9px;
      margin-bottom: 12px;
    }

    .matchPicker label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .matchSelect,
    .matchNavButton {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 850;
    }

    .matchSelect {
      width: 100%;
      padding: 0 40px 0 13px;
      cursor: pointer;
    }

    .matchNavButton {
      min-width: 76px;
      padding: 0 13px;
      cursor: pointer;
    }

    .matchNavButton:disabled { cursor: default; opacity: .38; }

    .gamePicker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 16px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #eef2f5;
    }

    .gameButton {
      min-height: 48px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 950;
      cursor: pointer;
    }

    .gameButton.active {
      background: var(--lime);
      color: #493700;
    }

    .teamControls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .teamControl {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(48, 61, 77, .07);
    }

    .controlTitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 10px 16px;
      font-size: 19px;
      font-weight: 950;
    }

    .whiteControl .controlTitle {
      color: var(--white-text);
      background: var(--white);
    }

    .blueControl .controlTitle {
      color: var(--white-text);
      background: var(--blue);
    }

    .currentValue {
      font-variant-numeric: tabular-nums;
      font-size: 27px;
    }

    .buttonRow {
      display: grid;
      grid-template-columns: .72fr 1.5fr;
      gap: 10px;
      padding: 12px;
    }

    .scoreButton {
      min-height: clamp(92px, 16vw, 138px);
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel-light);
      font-size: clamp(27px, 5vw, 42px);
      font-weight: 950;
      cursor: pointer;
      transition: transform .08s ease;
    }

    .scoreButton:active { transform: scale(.975); }

    .plus {
      color: #253044;
      background: var(--lime);
    }

    .whiteControl .plus { background: var(--white); }
    .blueControl .plus { background: var(--blue); }

    .minus { color: #536174; }

    .clearButton {
      width: 100%;
      min-height: 58px;
      margin-top: 14px;
      border: 1px solid rgba(199, 66, 80, .35);
      border-radius: 14px;
      background: #fff5f6;
      color: #c74250;
      font-size: 15px;
      font-weight: 950;
      cursor: pointer;
    }

    .clearButton:active { background: #ffe9ec; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      padding: 11px 17px;
      border: 1px solid rgba(79, 159, 207, .28);
      border-radius: 999px;
      background: #f0f9fd;
      color: #286f99;
      font-size: 12px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.displayOnly {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 18px;
      overflow: hidden;
      background: transparent;
    }

    body.displayOnly .app {
      width: min(900px, calc(100vw - 36px));
    }

    body.displayOnly .controls { display: none; }
    body.displayOnly .scoreboard {
      opacity: .92;
      box-shadow: 0 14px 38px rgba(48, 61, 77, .18);
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .scoreGrid { grid-template-columns: minmax(115px, 1.45fr) repeat(3, minmax(62px, 1fr)); }
      .team, .score, .total { min-height: 74px; }
      .matchHeader { grid-template-columns: 1fr; gap: 8px; padding: 12px; }
      .matchup { text-align: left; }
      .team { padding: 8px 11px; }
      .teamMark { width: 4px; height: 34px; margin-right: 8px; }
      .teamName { font-size: clamp(20px, 6vw, 30px); }
      .score, .total { font-size: clamp(29px, 8vw, 46px); }
      .teamControls { grid-template-columns: 1fr; }
      .matchNavButton { min-width: 54px; padding: 0 8px; font-size: 13px; }
      .scoreButton { min-height: 90px; }
    }

    @media (max-width: 420px) {
      .scoreboard { border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="scoreboard" aria-label="白隊對藍隊羽球計分板">
      <header class="matchHeader">
        <div class="matchMeta">
          <span id="matchNumber" class="matchNumber">第 1 場</span>
          <span id="matchType" class="matchType">男雙</span>
        </div>
        <div class="matchup" aria-label="目前對戰組合">
          <span id="matchupA">楊桃、彭博</span>
          <span class="versus">VS</span>
          <span id="matchupB">胖、萊恩</span>
        </div>
      </header>
      <div class="scoreGrid">
        <div class="gridHead" aria-hidden="true"></div>
        <div class="gridHead gameHead current" data-game="1">第 1 局</div>
        <div class="gridHead gameHead" data-game="2">第 2 局</div>
        <div class="gridHead">總分</div>

        <div class="team white">
          <span class="teamMark"></span>
          <span id="teamNameA" class="teamName">楊桃、彭博</span>
        </div>
        <button id="A1" class="score empty current" data-game="1" aria-label="白隊第一局分數">–</button>
        <button id="A2" class="score empty" data-game="2" aria-label="白隊第二局分數">–</button>
        <div id="totalA" class="total" aria-label="白隊兩局總分">0</div>

        <div class="team blue">
          <span class="teamMark"></span>
          <span id="teamNameB" class="teamName">胖、萊恩</span>
        </div>
        <button id="B1" class="score empty current" data-game="1" aria-label="藍隊第一局分數">–</button>
        <button id="B2" class="score empty" data-game="2" aria-label="藍隊第二局分數">–</button>
        <div id="totalB" class="total" aria-label="藍隊兩局總分">0</div>
      </div>
    </section>

    <section class="controls" aria-label="平板計分控制">
      <div class="matchPicker">
        <button id="previousMatch" class="matchNavButton" type="button">上一場</button>
        <label>
          目前對戰場次
          <select id="matchSelect" class="matchSelect" aria-label="選擇對戰場次"></select>
        </label>
        <button id="nextMatch" class="matchNavButton" type="button">下一場</button>
      </div>

      <div class="gamePicker" aria-label="選擇局數">
        <button class="gameButton active" data-pick-game="1">第 1 局</button>
        <button class="gameButton" data-pick-game="2">第 2 局</button>
      </div>

      <div class="teamControls">
        <article class="teamControl whiteControl">
          <div class="controlTitle">
            <span id="controlTeamA">楊桃、彭博</span>
            <span id="currentA" class="currentValue">0</span>
          </div>
          <div class="buttonRow">
            <button id="minusA" class="scoreButton minus" aria-label="白隊減一分">−1</button>
            <button id="plusA" class="scoreButton plus" aria-label="白隊加一分">+1</button>
          </div>
        </article>

        <article class="teamControl blueControl">
          <div class="controlTitle">
            <span id="controlTeamB">胖、萊恩</span>
            <span id="currentB" class="currentValue">0</span>
          </div>
          <div class="buttonRow">
            <button id="minusB" class="scoreButton minus" aria-label="藍隊減一分">−1</button>
            <button id="plusB" class="scoreButton plus" aria-label="藍隊加一分">+1</button>
          </div>
        </article>
      </div>

      <button id="clearButton" class="clearButton">清空本場比分</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./scoreboard-env.js"></script>
  <script type="module" src="./scoreboard.js"></script>
</body>
</html>
